name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22.19.0, 24.x]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm bootstrap
      - run: pnpm check
      - name: Reject generated changes
        shell: pwsh
        run: |
          $changes = git status --porcelain
          if ($changes) {
            $changes
            throw "CI commands changed the checkout"
          }
