bindings:
- id: REQ-boundary
  kind: requirement
  title: Maintenance 主体与适配器分工
  source_id: boundary-requirement
  heading: 用户要求与本轮范围
  status: current
  summary: 主体只维护逻辑身份、版本、选择和同步回执；实例、Launcher 与插件差异由适配器承担。
- id: REQ-opaque-mapping
  kind: requirement
  title: 插件数据忠实保留并由插件适配器映射
  source_id: opaque-requirement
  heading: 用户修正与实施范围
  status: current
  summary: 主体不建立图业务模型；缺插件时保留来源数据且不投放，适配器恢复到插件正常读取的位置。
- id: REQ-lynn-gpt
  kind: requirement
  title: Lynn 综合适配器和独立 GPT 适配器
  source_id: adapter-requirement
  heading: Lynn adapter 与独立 GPT adapter
  status: current
  summary: Lynn 按成员握手处理指定组合，GPT compat 独立；外部 Vault 内容和机器绑定不随会话复制。
- id: VER-sync-20260922
  kind: verification
  title: 2026-09-22 同步路径合成验证
  source_id: boundary-requirement
  heading: 验证结果
  status: current
  summary: 该日源码候选与合成测试的历史证据，不代表当前实例验收。
- id: VER-host-20260922
  kind: verification
  title: 2026-09-22 写入屏障与映射合成验证
  source_id: opaque-requirement
  heading: 验证
  status: current
  summary: 该日宿主与插件映射测试的历史证据，不代表当前实例验收。
- id: REQ-ownership
  kind: requirement
  title: 扩展条目归哪个会话
  source_id: source-2
  heading: 业务 Adapter 与所属会话
  status: current
  summary: 按工作区、接收会话和业务条目浏览；引用来源不是所有者。
- id: REQ-reader
  kind: requirement
  title: 长会话怎样阅读
  source_id: source-2
  heading: 会话阅读器
  status: current
  summary: 问答直接展示，本轮过程折叠、分级按需加载，保留可信来源角色。
- id: REQ-context
  kind: requirement
  title: 原生上下文管理的授权边界
  source_id: source-3
  heading: 1. 已确认的产品决定
  status: current
  summary: 固定授权、活动窗口与实际保留材料分开；不修改历史真源。
- id: REQ-source
  kind: requirement
  title: 引用固定来源和完成位置
  source_id: source-4
  heading: 3. 功能需求：跨会话引用
  status: current
  summary: 用户确定源版本和已完成回复截止，后续源更新不自动扩大范围。
- id: VER-context
  kind: verification
  title: 原生上下文实现的历史验证
  source_id: source-5
  heading: 验证对应
  status: current
  summary: 历史时点的验证证据，不证明当前安装副本和真实界面已通过。
- id: VER-reader
  kind: verification
  title: 目录与阅读器的历史交付验证
  source_id: source-6
  heading: 验证与部署
  status: current
  summary: 历史时点的验证证据，不证明当前安装副本和真实界面已通过。
- id: REQ-adapter-families
  kind: requirement
  title: 两类 Adapter 独立的要求
  source_id: source-extension-requirements
  heading: 两类 Adapter
  status: current
  summary: 平台格式和业务对象的注册、兼容与启用独立。
- id: REQ-main-graph
  kind: requirement
  title: 每个接收会话自己的主干图
  source_id: source-4
  heading: 5.2 每个会话自己的主干图
  status: current
  summary: Lynn 插件拥有每会话图和固定来源；Maintenance 仅保留带类型的原值并交给 Lynn adapter 映射。
- id: REQ-graph-removal
  kind: requirement
  title: 移除与撤销保持一致
  source_id: source-4
  heading: 5.4 移除、撤销和刷新
  status: current
  summary: Lynn 插件的解除、撤销与刷新应按其 adapter 恢复；真源不将旧关联作为通用图业务解释。
- id: REQ-runtime-space
  kind: requirement
  title: 持久原生空间的范围
  source_id: source-native-space
  heading: 目标与本次范围
  status: current
  summary: 持久原生空间保留身份、租约、关闭与恢复保护；同步写回例外按后续用户确认的独占协议执行。
- id: REQ-extension-pages
  kind: requirement
  title: 业务插件自主信息页与共享实例范围
  source_id: extension-pages-design
  heading: 已确认需求
  status: current
  summary: 插件贡献页面与共享实例范围均须按提供者注册及身份核验，真实 UI 验收独立记录。
- id: IF-instance-workspace-scope
  kind: interface
  title: 实例有效工作区与会话范围合同草案
  source_id: extension-pages-design
  heading: 实例有效范围合同草案
  status: current
  summary: 实例有效范围按显式选择，未选择即空；旧规格中 legacy all 语义已由后续用户决定替代。
- id: VER-extension-pages-design
  kind: verification
  title: 公开扩展页设计的文档检查
  source_id: extension-pages-design-report
  heading: 验证结果
  status: current
  summary: 历史时点的验证证据，不证明当前安装副本和真实界面已通过。
- id: CONTRIBUTOR-rules
  kind: constraint
  title: Session Maintenance 仓库开发约定
  source_id: repo-agents
  heading: Session Maintenance contributor rules
  status: current
  strength: must
  summary: 测试与来源校验、平台格式在适配器、编排留在 Engine、共享 DTO 在 contracts、避免旧运行时兼容分支。
- id: MIG-map-disposition
  kind: note
  title: 旧地图覆盖与逐条去向
  source_id: map-migration
  heading: 旧地图资产逐条去向
  status: current
  summary: 重构前旧资产 103 条的保留、合并、撤销和历史定位索引。
